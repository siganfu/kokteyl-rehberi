name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4
      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK lisanslarini kabul et
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Gerekli SDK paketlerini indir
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager platform-tools "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Birim testlerini calistir
        run: gradle test --no-daemon --stacktrace
      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: KokteylRehberi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
