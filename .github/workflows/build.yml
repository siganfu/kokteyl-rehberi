name: Build APK

# Bu dosya projeyi GitHub üzerinde otomatik derler ve APK'yı "Artifacts" olarak sunar.
# Yerel bilgisayarda Android SDK/Gradle kurmaya gerek kalmaz.
#
# Kullanım:
#   1) Bu klasörü bir GitHub deposuna yükleyin (push edin).
#   2) GitHub'da depo sayfasında "Actions" sekmesine girin.
#   3) "Build APK" iş akışını seçip "Run workflow" butonuna basın (veya main'e push edince otomatik çalışır).
#   4) İş bitince açılan çalıştırmanın altındaki "Artifacts" bölümünden
#      "KokteylRehberi-debug-apk" dosyasını indirin; içinde app-debug.apk olacaktır.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur (8.10.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Birim testlerini çalıştır
        run: gradle test --no-daemon --stacktrace

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle (indirilebilir çıktı)
        uses: actions/upload-artifact@v4
        with:
          name: KokteylRehberi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
